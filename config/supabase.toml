project_id = "{{server.local.supabaseProjectId}}"

[api]
enabled = true
port = {{server.local.supabaseApiPort}}
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = {{server.local.supabaseDbPort}}
shadow_port = {{server.local.supabaseShadowPort}}
major_version = 17
health_timeout = "3m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = {{server.local.supabaseStudioPort}}
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = {{server.local.supabaseMailPort}}

[storage]
enabled = false

[auth]
enabled = true
site_url = "{{origins.app}}"
additional_redirect_urls = ["{{origins.app}}/auth/callback", "{{origins.app}}/auth/callback?next=/reset-password", "{{origins.test}}/auth/callback", "{{origins.test}}/auth/callback?next=/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = {{auth.passwordMinLength}}
password_requirements = ""

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "{{auth.resetCooldownSeconds}}s"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = false

[analytics]
enabled = false
